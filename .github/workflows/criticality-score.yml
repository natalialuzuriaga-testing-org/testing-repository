name: Go CI
on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # or 'stable'
          cache: true        # automatically caches dependencies

      - name: Run criticality score
        shell: bash
        run: |
          go install github.com/ossf/criticality_score/v2/cmd/criticality_score@latest
          criticality_score -depsdev-disable https://github.com/DSACMS/repo-scaffolder -format=json
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
